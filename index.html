<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Payment Demo Simulation</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e99cf2,#f6cafa);
  color:#28105e;
}
button,input{font:inherit}
button{cursor:pointer}

.screen{
  min-height:100vh;
  padding:24px 18px 35px;
  display:none;
}
.screen.active{display:block}

.demo{
  display:inline-block;
  background:#ffe26a;
  color:#24105c;
  font-weight:800;
  padding:9px 18px;
  border-radius:25px;
  margin:0 auto 20px;
  font-size:13px;
}
.center{text-align:center}

h1{
  margin:10px 0;
  font-size:40px;
}
h2{
  font-size:30px;
  margin:15px 0;
}
h3{margin:8px 0}

.card{
  background:#fff;
  border-radius:28px;
  padding:22px;
  box-shadow:0 8px 25px #7c35aa30;
}

.btn{
  border:0;
  border-radius:28px;
  padding:15px 24px;
  background:linear-gradient(90deg,#7c18df,#a51ddd);
  color:#fff;
  font-weight:800;
  width:100%;
  margin-top:15px;
}

.back{
  background:none;
  border:0;
  color:#351070;
  font-size:24px;
  margin-bottom:10px;
}

.home-sub{
  font-size:21px;
  margin-bottom:45px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.product{
  background:#fff;
  border-radius:25px;
  overflow:hidden;
  box-shadow:0 7px 20px #76208d35;
}
.product-title{
  padding:25px 10px 18px;
  text-align:center;
  font-size:21px;
  font-weight:800;
}
.price{
  background:linear-gradient(90deg,#8617dc,#bb20dd);
  color:white;
  text-align:center;
  font-size:34px;
  font-weight:900;
  padding:14px 5px;
}
.features{
  padding:15px 16px;
  line-height:2;
  font-size:15px;
}
.product .btn{
  width:85%;
  margin:5px 7.5% 22px;
}

.bottomBtns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:65px;
}

.payment-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.amount{
  font-size:34px;
  font-weight:900;
}
.qr{
  margin:20px auto;
  width:270px;
  height:270px;
  border:3px solid #ddd;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
   repeating-linear-gradient(45deg,#111 0 5px,#fff 5px 10px);
  color:white;
  font-size:32px;
  font-weight:900;
}
.input{
  width:100%;
  padding:16px;
  border:2px solid #ddd;
  border-radius:15px;
  outline:none;
  margin:6px 0 15px;
  color:#24105c;
}
.label{
  font-weight:700;
  display:block;
  margin-top:8px;
}

.dashboard{
  background:#fff;
  min-height:100vh;
  margin:-24px -18px -35px;
  padding:20px 18px 30px;
}
.purple{
  background:linear-gradient(145deg,#4415d6,#701ce0);
  color:#fff;
  border-radius:30px;
  padding:24px;
}
.balance{
  font-size:36px;
  font-weight:900;
  margin:15px 0;
}
.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:25px 0;
}
.quick button{
  border:0;
  background:#f0ebff;
  color:#28105e;
  padding:15px 5px;
  border-radius:18px;
  font-weight:700;
}
.section{
  margin-top:25px;
}
.history{
  background:#fff;
  border:1px solid #ddd;
  padding:17px;
  border-radius:18px;
  margin-top:10px;
}
.green{color:#09a65b;font-weight:800}

.field-group{margin-bottom:8px}

.account{
  border:2px solid #ddd;
  border-radius:20px;
  padding:20px;
  margin:14px 0;
  display:flex;
  align-items:center;
  gap:15px;
}
.account.selected{
  border-color:#681de0;
  background:#f4efff;
}
.radio{
  width:23px;
  height:23px;
  border:3px solid #ccc;
  border-radius:50%;
}
.selected .radio{
  border:7px solid #6820df;
}

.pin-dots{
  display:flex;
  justify-content:center;
  gap:24px;
  margin:35px 0;
}
.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  background:#ddd;
}
.dot.on{background:#6420df}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.key{
  border:0;
  background:#f0ecff;
  color:#351078;
  padding:20px;
  border-radius:20px;
  font-size:25px;
  font-weight:800;
}
.key.pay{background:#6420df;color:#fff}

.loading{
  width:180px;
  height:70px;
  border-radius:50px;
  background:linear-gradient(90deg,#d856e5,#5520df);
  margin:100px auto 35px;
  animation:pulse 1s infinite alternate;
}
@keyframes pulse{
  from{transform:scale(.92)}
  to{transform:scale(1.05)}
}

.success{
  background:#13c94d;
  color:#fff;
  margin:-24px -18px 20px;
  padding:35px 22px;
  border-radius:0 0 30px 30px;
}
.success h2{color:#fff}

.detail{
  display:flex;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #eee;
  gap:15px;
}
.detail span:last-child{
  font-weight:800;
  text-align:right;
}

@media(max-width:600px){
  .products{grid-template-columns:1fr 1fr}
  h1{font-size:36px}
  .quick{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
